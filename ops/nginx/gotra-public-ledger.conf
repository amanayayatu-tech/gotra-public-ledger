# GOTRA public ledger Nginx site template.
# Install to /etc/nginx/sites-available/gotra-public-ledger and symlink from
# /etc/nginx/sites-enabled/gotra-public-ledger.
#
# Certificate files are managed outside Git by Certbot/Let's Encrypt. This
# template records expected paths only; do not commit certificate material.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/gotra-public-site-locations.conf;
}

server {
    server_name gotra.me www.gotra.me;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; form-action 'self'; upgrade-insecure-requests" always;

    include /etc/nginx/snippets/gotra-public-site-locations.conf;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gotra.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gotra.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.gotra.me) {
        return 301 https://$host$request_uri;
    }

    if ($host = gotra.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name gotra.me www.gotra.me;
    return 404;
}
